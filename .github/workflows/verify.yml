name: Verify Atlas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate install lock for this run
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies from lock
        run: npm ci --no-audit --no-fund

      - name: Verify TypeScript, unit/integration tests and public prototype
        run: npm run verify

      - name: Build production frontend and run static-export e2e smoke tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_BASE_PATH: /ATLAS
