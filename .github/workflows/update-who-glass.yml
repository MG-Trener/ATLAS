name: Update WHO GLASS snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/update-who-glass.mjs'
      - '.github/workflows/update-who-glass.yml'

permissions:
  contents: write

concurrency:
  group: who-glass-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and validate WHO GLASS
        run: node scripts/update-who-glass.mjs
      - name: Commit verified snapshot
        run: |
          if git diff --quiet -- data/who-glass.json; then
            echo "WHO snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/who-glass.json
          git commit -m "data: refresh WHO GLASS snapshot [skip ci]"
          git push
